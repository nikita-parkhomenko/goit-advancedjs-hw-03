<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/goit-advancedjs-hw-03/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pixabay Image Search</title>
    <script type="module" crossorigin src="/goit-advancedjs-hw-03/index.js"></script>
    <link rel="modulepreload" crossorigin href="/goit-advancedjs-hw-03/assets/vendor-B4VkUtbg.js">
    <link rel="stylesheet" crossorigin href="/goit-advancedjs-hw-03/assets/vendor-DumFYO8Z.css">
    <link rel="stylesheet" crossorigin href="/goit-advancedjs-hw-03/assets/index-CFkBb5OM.css">
  </head>
  <body>
    <main class="container">
      <form class="form">
        <label>
          <input
            type="text"
            name="search-text"
            placeholder="Search images..."
            aria-label="Search images"
            required
          />
        </label>
        <button type="submit">Search</button>
      </form>
      <div class="loading" role="status" hidden>
        <span class="loader" aria-hidden="true"></span>
        <p>Loading images, please wait...</p>
      </div>
      <ul class="gallery" aria-label="Search results" aria-busy="false"></ul>
    </main>

  </body>
</html>
